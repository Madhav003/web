<!DOCTYPE html>
<html>
<head>
    <title>My Movies &amp; Location</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <style>
        :root{
            --gold: #b8860b;
            --gold-light: #d4a537;
            --paper: #faf7f2;
            --ink: #2b2620;
            --ink-soft: #6b6459;
            --hairline: #e6ddcf;
            --bs-primary: var(--gold);
            --bs-primary-rgb: 184, 134, 11;
            --bs-body-font-family: 'Jost', sans-serif;
            --bs-border-radius: 2px;
        }
        body{
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: var(--paper);
            color: var(--ink);
            letter-spacing: 0.02em;
        }
        h2{
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        h2::after{
            content: "";
            display:block;
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 18px auto 0;
        }
        hr{ border-top: 1px solid var(--hairline); opacity: 1; }
        .coord-card{
            background: #fff;
            border: 1px solid var(--hairline);
            border-left: 3px solid var(--gold);
        }
        .list-group-item{
            background: #fff;
            border-color: var(--hairline);
        }
        .stars{ color: var(--gold-light); letter-spacing: 0.1em; }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 700px;">

    <h2 class="text-center mb-4">My Movies &amp; Location</h2>

    <p class="text-center mb-4">
        <a href="index.html" class="link-secondary text-decoration-none small">← Back to Movie Logger</a>
    </p>

    <!-- Geolocation card -->
    <div class="card coord-card mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Your Current Coordinates</h5>
            <p id="locationStatus" class="mb-0 text-muted">Locating…</p>
        </div>
    </div>

    <hr>

    <h5 class="mb-3">Saved Movies &amp; Watch Locations</h5>
    <ul class="list-group" id="movieList"></ul>

</div>

<script>

/* ---------- Read the same list saved by the main page ---------- */
const movies = JSON.parse(localStorage.getItem("movies") || "[]");
const list = document.getElementById("movieList");
if (!movies.length) {
    list.innerHTML = '<li class="list-group-item text-muted">No movies saved yet.</li>';
} else {
    movies.forEach(function(m){
        const coordsText = m.lat !== null && m.lng !== null
            ? `Watched at: Lat ${m.lat}, Lng ${m.lng}`
            : "Location not saved";
        list.innerHTML +=
        `<li class="list-group-item d-flex justify-content-between align-items-center flex-wrap">
            <div class="me-3">
                <div class="fw-bold">${m.title}</div>
                <small class="text-muted">${coordsText}</small>
            </div>
            <span class="stars">${"★".repeat(m.rating || 0)}</span>
        </li>`;
    });
}

/* ---------- Geolocation API ---------- */
let status = document.getElementById("locationStatus");

if("geolocation" in navigator){
    navigator.geolocation.getCurrentPosition(
        function(pos){
            let lat = pos.coords.latitude.toFixed(6);
            let lng = pos.coords.longitude.toFixed(6);
            status.innerHTML =
                `<strong>Latitude:</strong> ${lat}<br>
                <strong>Longitude:</strong> ${lng}<br>
                <span class="text-muted small">Accuracy: ±${pos.coords.accuracy.toFixed(0)} m</span>`;
            },
            function(err){
                status.innerHTML = `<span class="text-danger">Unable to retrieve location: ${err.message}</span>`;
            }
        );
} else {
    status.textContent = "Geolocation is not supported by this browser.";
}

</script>

</body>
</html>
