<!DOCTYPE html>
<html>
<head>
    <title>Movie Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Jost', sans-serif; background: #faf7f2; color: #2b2620; }
        h1 { font-family: 'Cormorant Garamond', serif; letter-spacing: .04em; color: #b8860b; cursor: pointer; }
        .poster { aspect-ratio: 2/3; object-fit: cover; }
        .drop-zone.drag-active { border-color: #b8860b; background: rgba(184, 134, 11, .05); color: #b8860b; }
    </style>
</head>
<body class="min-h-screen bg-[#faf7f2] text-neutral-800 antialiased">

<div id="app">

<div class="container py-5" style="max-width: 900px;">
    <div v-if="!currentUser" class="mx-auto" style="max-width: 420px;">
        <h1 class="text-center mb-3 text-[clamp(2.5rem,6vw,4rem)] font-semibold">Movie Logger</h1>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">Sign in</h2>
                <form @submit.prevent="login">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" v-model.trim="loginForm.username" class="form-control mb-3" autocomplete="username" required>
                    <label class="form-label" for="password">Password</label>
                    <input id="password" v-model="loginForm.password" class="form-control mb-3" type="password" autocomplete="current-password" required>
                    <button class="btn w-100 text-white" style="background:#b8860b;border-color:#b8860b;" :disabled="isLoggingIn" type="submit">
                        {{ isLoggingIn ? 'Signing in...' : 'Sign in' }}
                    </button>
                </form>
                <p v-if="authError" class="text-danger small mt-3 mb-0">{{ authError }}</p>
                <p class="text-secondary small mt-3 mb-0">Demo accounts: jay / 1234 or student / 1234</p>
            </div>
        </div>
    </div>

    <template v-else>
    <div class="text-end small text-secondary mb-2">
        <span v-human-date="currentDate"></span>
    </div>
    <h1 v-uppercase-on-click class="text-center mb-3 text-[clamp(2.5rem,6vw,4rem)] font-semibold">Movie Logger</h1>
    <div class="d-flex justify-content-center align-items-center gap-3 mb-4 small">
        <span>Signed in as <strong>{{ currentUser.username }}</strong> ({{ currentUser.role }})</span>
        <button class="btn btn-sm btn-outline-secondary" type="button" @click="logout">Sign out</button>
    </div>
    <p class="text-center mb-4">
        <a href="geolocation.html" class="small text-secondary text-decoration-none">View my movies &amp; location →</a>
    </p>

    <form class="row justify-content-center g-2 mb-3" @submit.prevent="addMovie">
        <div class="col-auto">
            <input v-model.trim="newMovie.title" class="form-control shadow-sm focus:ring-2 focus:ring-[#b8860b] focus:border-[#b8860b]" type="text" placeholder="Movie Name" aria-label="Movie name">
        </div>
        <div class="col-auto">
            <select v-model.number="newMovie.rating" class="form-select" aria-label="Movie rating">
                <option v-for="rating in 5" :key="rating" :value="rating">{{ '★'.repeat(rating) }}</option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn text-white transition duration-200 hover:shadow-md hover:scale-[1.01] disabled:opacity-60 disabled:cursor-not-allowed" style="background:#b8860b;border-color:#b8860b;" :disabled="isAdding || !newMovie.title" type="submit">{{ isAdding ? 'Adding...' : 'Add Movie' }}</button>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3 small text-secondary">
        <span>{{ movies.length }} movies</span>
        <span v-if="movies.length">Average rating: {{ averageRating }} / 5</span>
    </div>

    <div v-if="isAdmin" class="drop-zone text-center small py-3 mb-4 rounded border-2 border-dashed border-secondary-subtle" :class="{ 'drag-active': isDragging }" @dragover.prevent="isDragging = true" @dragenter.prevent="isDragging = true" @dragleave.prevent="isDragging = false" @drop.prevent="importFile($event)">
        Drag &amp; drop a <code>.json</code> file here to import movies
    </div>

    <hr class="mb-4">
    <p v-if="!movies.length" class="text-center text-secondary py-4">No movies yet.</p>
    <div v-else class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        <div v-for="movie in movies" :key="movie.id" class="col">
            <div class="bg-[#f5efe7] border border-[#e6ddcf] rounded overflow-hidden shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-md">
                <img class="poster w-100 border-bottom border-[#e6ddcf] transition duration-200" :src="posterFor(movie)" :alt="`${movie.title} poster`" @error="useFallback($event, movie)">
                <div class="d-flex justify-content-between align-items-center gap-2 p-2 bg-[#f5efe7]">
                    <div class="flex-grow-1 text-truncate">
                        <div class="small fw-medium text-dark mb-1 text-truncate" :title="movie.title">{{ movie.title }}</div>
                        <div class="small tracking-[.2em] text-warning">{{ '★'.repeat(movie.rating || 0) }}</div>
                    </div>
                    <button v-if="isAdmin" type="button" class="btn btn-sm btn-light border" @click="deleteMovie(movie.id)">Delete</button>
                </div>
                </template>
            </div>
        </div>
    </div>
</div>

</div>

<script>
const { createApp } = Vue;
const AUTH_TOKEN_KEY = 'movieLoggerAuthToken';

async function responseData(response) {
    const text = await response.text();
    try {
        return text ? JSON.parse(text) : {};
    } catch {
        throw new Error(`Server returned invalid data (HTTP ${response.status})`);
    }
}

function buildFallbackPoster(title) {
    const safe = (title || 'Movie').replace(/[&<>"']/g, '');
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
            <rect width="400" height="600" fill="#f3e8d6"/>
            <rect x="26" y="26" width="348" height="548" rx="14" fill="rgba(255,255,255,.22)" stroke="#c8ac6d"/>
            <text x="200" y="298" text-anchor="middle" font-size="28" font-family="Georgia,serif" fill="#2b2620" font-weight="700">${safe}</text>
            <text x="200" y="340" text-anchor="middle" font-size="15" letter-spacing="3" font-family="Arial,sans-serif" fill="#6b6459">MOVIE POSTER</text>
        </svg>
    `;
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
}

createApp({
    data() {
        return {
            movies: [],
            newMovie: { title: '', rating: 5 },
            isAdding: false,
            isDragging: false,
            currentDate: new Date(),
            currentUser: null,
            loginForm: { username: '', password: '' },
            authError: '',
            isLoggingIn: false
        };
    },
    created() {
        this.restoreSession();
    },
    computed: {
        isAdmin() {
            return this.currentUser && this.currentUser.role === 'admin';
        },
        averageRating() {
            if (!this.movies.length) return '0.0';
            const average = this.movies.reduce((total, movie) => total + (movie.rating || 0), 0) / this.movies.length;
            return average.toFixed(1);
        }
    },
    methods: {
        async login() {
            this.isLoggingIn = true;
            this.authError = '';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.loginForm)
                });
                const result = await responseData(response);
                if (!response.ok) throw new Error(result.message || 'Authentication failed');
                sessionStorage.setItem(AUTH_TOKEN_KEY, result.token);
                this.currentUser = result.user;
                await this.loadMovies();
                this.loginForm = { username: '', password: '' };
            } catch (error) {
                this.authError = error.message;
            } finally {
                this.isLoggingIn = false;
            }
        },
        async restoreSession() {
            const token = sessionStorage.getItem(AUTH_TOKEN_KEY);
            if (!token) return;
            try {
                const response = await fetch('/api/me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Session expired');
                this.currentUser = (await responseData(response)).user;
                await this.loadMovies();
            } catch {
                sessionStorage.removeItem(AUTH_TOKEN_KEY);
            }
        },
        async logout() {
            const token = sessionStorage.getItem(AUTH_TOKEN_KEY);
            if (token) {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${token}` }
                });
            }
            sessionStorage.removeItem(AUTH_TOKEN_KEY);
            this.currentUser = null;
        },
        addMovie() {
            if (!this.newMovie.title || this.isAdding) return;
            const title = this.newMovie.title;
            const rating = this.newMovie.rating;
            this.isAdding = true;

            const finish = async (lat, lng) => {
                const token = sessionStorage.getItem(AUTH_TOKEN_KEY);
                const response = await fetch('/api/movies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ title, rating, lat, lng })
                });
                if (!response.ok) throw new Error('Could not save movie');
                this.movies.unshift(await responseData(response));
                this.newMovie = { title: '', rating: 5 };
                this.isAdding = false;
            };

            if (!navigator.geolocation) {
                finish(null, null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                position => finish(position.coords.latitude, position.coords.longitude),
                error => {
                    console.warn('Location failed:', error.message);
                    finish(null, null);
                },
                { enableHighAccuracy: false, timeout: 1000, maximumAge: 0 }
            );
        },
        async loadMovies() {
            const response = await fetch('/api/movies', {
                headers: { Authorization: `Bearer ${sessionStorage.getItem(AUTH_TOKEN_KEY)}` }
            });
            if (!response.ok) throw new Error('Could not load movies');
            this.movies = await responseData(response);
        },
        async deleteMovie(id) {
            await fetch(`/api/movies/${id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${sessionStorage.getItem(AUTH_TOKEN_KEY)}` }
            });
            await this.loadMovies();
        },
        posterFor(movie) {
            return movie.poster || `https://picsum.photos/seed/${encodeURIComponent(movie.title)}/400/600`;
        },
        useFallback(event, movie) {
            event.target.onerror = null;
            event.target.src = buildFallbackPoster(movie.title);
        },
        importFile(event) {
            this.isDragging = false;
            const file = event.dataTransfer.files[0];
            if (!file || !file.name.toLowerCase().endsWith('.json')) {
                alert('Please drop a .json file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = loadEvent => {
                try {
                    const imported = JSON.parse(loadEvent.target.result);
                    if (!Array.isArray(imported)) throw new Error();
                    fetch('/api/movies/import', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${sessionStorage.getItem(AUTH_TOKEN_KEY)}`
                        },
                        body: JSON.stringify(imported.filter(item => item && item.title))
                    }).then(() => this.loadMovies());
                } catch {
                    alert("That file isn't valid JSON.");
                }
            };
            reader.readAsText(file);
        }
    }
}).directive('human-date', {
    mounted(element, binding) {
        element.textContent = new Date(binding.value).toLocaleDateString(undefined, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    },
    updated(element, binding) {
        element.textContent = new Date(binding.value).toLocaleDateString(undefined, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    }
}).directive('uppercase-on-click', {
    mounted(element) {
        element.addEventListener('click', () => {
            element.textContent = element.textContent.toUpperCase();
        });
    }
}).mount('#app');
</script>

</body>
</html>
