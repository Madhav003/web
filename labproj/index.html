<!-- I. Create a responsive web page involves using the viewport meta tag in the head of your
HTML document.
II. Create a responsive web page by using the width and max-width Properties and Changing
images according to the browser width.
III. Create a responsive web page that demonstrates responsive text size using the "vw"
(viewport width) unit in CSS
IV. Create a responsive web page that demonstrates media queries for creating breakpoints in
the web page. -->
<!DOCTYPE html>
<html>
<head>

    <title>Movie Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- I. Viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Elegant serif for headings/titles, refined light sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --gold: #b8860b;
            --gold-light: #d4a537;
            --paper: #faf7f2;
            --ink: #2b2620;
            --ink-soft: #6b6459;
            --hairline: #e6ddcf;
        }

        body{
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            /* II. width + max-width instead of a fixed px width */
            width: 92%;
            max-width: 900px;
            margin: 60px auto;
            background: var(--paper);
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        h2{
            /* III. responsive text size using vw, capped with clamp() so it
               doesn't get silly on very wide or very narrow screens */
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            text-align: center;
            letter-spacing: 0.04em;
            color: var(--ink);
            margin-bottom: 4px;
        }

        h2::after{
            content: "";
            display:block;
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 18px auto 40px;
        }

        .controls{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap: 10px;
        }

        input,select,button{
            padding:10px 14px;
            margin:5px;
            border-radius:2px;
            border: 1px solid var(--hairline);
            background: #fff;
            font-family: 'Jost', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            color: var(--ink);
        }

        input:focus, select:focus{
            outline: none;
            border-color: var(--gold);
        }

        button{
            cursor:pointer;
            background-color: var(--gold);
            color: #fff;
            border: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
            transition: background-color 0.2s ease;
        }

        button:hover{
            background-color: var(--gold-light);
        }

        delete{
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--hairline);
            padding: 4px 10px;
            border-radius: 2px;
            float: right;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        delete:hover{
            border-color: var(--gold);
            color: var(--gold);
        }

        hr{
            border: none;
            border-top: 1px solid var(--hairline);
            margin: 30px 0;
        }

        ul{
            list-style:none;
            padding:0;
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        li{
            position: relative;
            aspect-ratio: 2 / 3;
            border-radius: 3px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 1px 3px rgba(43,38,32,0.08);
            cursor: pointer;
        }

        /* II. poster image fills its card and resizes fluidly with it */
        .poster{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay{
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(20,17,12,0.92) 0%, rgba(20,17,12,0.55) 45%, rgba(20,17,12,0) 75%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        li:hover .overlay,
        li.active .overlay{
            opacity: 1;
        }

        .movie-title{
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: #fff;
            line-height: 1.15;
        }

        .stars{
            color: var(--gold-light);
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            margin-top: 4px;
            display: block;
        }

        delete{
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(20,17,12,0.6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 0.62rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }

        delete:hover{
            border-color: var(--gold-light);
            color: var(--gold-light);
        }

        /* IV. Breakpoint 1: small phones — stack the form controls,
           posters go to a single column so they stay big and readable */
        @media (max-width: 480px){
            input, select, button{
                display:block;
                width:100%;
                margin:8px 0;
            }

            ul{
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        /* IV. Breakpoint 2: tablets — 2 posters per row */
        @media (min-width: 481px) and (max-width: 768px){
            body{
                width: 95%;
            }

            ul{
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* IV. Breakpoint 3: desktop — full 4-across poster wall */
        @media (min-width: 769px){
            ul{
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

<h2>Movie Logger</h2>

<div class="controls">
    <input type="text" id="title" placeholder="Movie Name">

    <select id="rating">
        <option value="5">★★★★★</option>
        <option value="4">★★★★</option>
        <option value="3">★★★</option>
        <option value="2">★★</option>
        <option value="1">★</option>
    </select>

    <button onclick="addMovie()">Add Movie</button>
</div>

<hr>

<ul id="movieList"></ul>

<script>

let movies = [
    {
        "title":"One Battle After Another",
        "rating":5
    },
    {
        "title":"Italian Spiderman",
        "rating":5
    }
];

displayMovies();

function addMovie(){

    let title = document.getElementById("title").value;
    let rating = Number(document.getElementById("rating").value);

    if(title=="")
        return;

    movies.push({
        "title":title,
        "rating":rating
    });

    document.getElementById("title").value="";

    displayMovies();
}

function displayMovies(){

    let list = document.getElementById("movieList");

    list.innerHTML="";

    for(let i=0;i<movies.length;i++){

        // II. poster image sourced per-movie, resizes responsively via .poster CSS
        let posterUrl = `https://picsum.photos/seed/${encodeURIComponent(movies[i].title)}/400/600`;

        list.innerHTML +=
        `<li onclick="toggleActive(this, event)">
            <img class="poster" src="${posterUrl}" alt="${movies[i].title} poster">
            <div class="overlay">
                <div class="movie-title">${movies[i].title}</div>
                <span class="stars">${"★".repeat(movies[i].rating)}</span>
            </div>
            <delete onclick="deleteMovie(${i}, event)"> Delete </delete>
        </li>`;
    }
    console.log(movies);

}

function toggleActive(card, event){
    // lets tap-to-reveal work on touch devices, alongside :hover for desktop
    if(event.target.tagName.toLowerCase() === "delete")
        return;

    document.querySelectorAll("#movieList li").forEach(function(li){
        if(li !== card) li.classList.remove("active");
    });

    card.classList.toggle("active");
}

function deleteMovie(index, event){

    event.stopPropagation();

    movies.splice(index,1);

    displayMovies();

}

</script>

</body>
</html>
