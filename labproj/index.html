<!DOCTYPE html>
<html>
<head>
    <title>Movie Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{
            --gold: #b8860b;
            --paper: #faf7f2;
            --ink: #2b2620;
            --ink-soft: #6b6459;
            --hairline: #e6ddcf;
        }
        body{
            font-family: 'Jost', sans-serif;
            background: var(--paper);
            color: var(--ink);
        }
        h2{
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(2.6rem, 7vw, 3.8rem);
            letter-spacing: 0.04em;
            color: var(--ink);
        }
        .movie-poster {
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
            width: 100%;
            border-radius: 4px 4px 0 0;
            border: 1px solid var(--hairline);
            background: #eee;
        }
        .movie-card {
            background: #f5efe7;
            border: 1px solid var(--hairline);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .movie-meta {
            padding: 10px 10px 12px;
            background: #f5efe7;
        }
        .movie-name {
            font-size: 0.88rem;
            font-weight: 500;
            color: #2f2a24;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .movie-stars {
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: var(--gold);
        }
        .delete-btn {
            border: 1px solid #d9d0c3;
            background: #f8f5f0;
            color: var(--ink);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
        }
        #dropZone{
            border: 2px dashed var(--hairline);
            border-radius: 6px;
            color: var(--ink-soft);
            transition: all 0.2s ease;
        }
        #dropZone.drag-active{
            border-color: var(--gold);
            background: rgba(184, 134, 11, 0.05);
            color: var(--gold);
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 900px;">

    <h2 class="text-center mb-3">Movie Logger</h2>

    <p class="text-center mb-4">
        <a href="geolocation.html" class="link-secondary text-decoration-none small">View my movies &amp; location →</a>
    </p>

    <form class="row row-cols-auto justify-content-center g-2 align-items-center mb-3" onsubmit="return false;">
        <div class="col">
            <input type="text" id="title" class="form-control" placeholder="Movie Name">
        </div>
        <div class="col">
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="ratingDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="ratingLabel">★★★★★</span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="ratingDropdown">
                    <li><a class="dropdown-item" href="#" onclick="setRating(5, this)">★★★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(4, this)">★★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(3, this)">★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(2, this)">★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(1, this)">★</a></li>
                </ul>
            </div>
        </div>
        <div class="col">
            <button class="btn btn-primary" style="background-color: var(--gold); border-color: var(--gold); color: #fff;" onclick="addMovie()" id="addBtn">Add Movie</button>
        </div>
    </form>

    <!-- Drag & Drop target -->
    <div id="dropZone" class="text-center small py-3 mb-4">
        Drag &amp; drop a <code>.json</code> file here to import movies
    </div>

    <hr class="mb-4">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3 pt-2" id="movieList"></div>

</div>

<script>

/* ---------- Local Storage ---------- */
let STORAGE_KEY = "movies";

let defaultMovies = [
    {"title":"One Battle After Another","rating":5, "lat":null, "lng":null},
    {"title":"Italian Spiderman","rating":5, "lat":null, "lng":null},
    {"title":"richa","rating":4, "lat":null, "lng":null},
    {"title":"The Godfather","rating":5, "lat":null, "lng":null}
];

let stored = localStorage.getItem(STORAGE_KEY);
let movies;
try {
    movies = stored ? JSON.parse(stored) : defaultMovies.slice();
} catch(e){
    movies = defaultMovies.slice();
}

let selectedRating = 5;

displayMovies();

function saveMovies(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
}

function setRating(value, el){
    selectedRating = value;
    document.getElementById("ratingLabel").textContent = "★".repeat(value);
}

function getMovieLocation(successCallback, errorCallback){
    if (!("geolocation" in navigator)) {
        errorCallback(new Error("Geolocation is not supported by this browser."));
        return;
    }

    const isLocalhost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
    if (!window.isSecureContext && !isLocalhost) {
        errorCallback(new Error("Geolocation requires HTTPS or localhost."));
        return;
    }

    navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    });
}

function addMovie(){
    let title = document.getElementById("title").value.trim();
    if(title == "") return;

    document.getElementById("title").value = "";
    let addBtn = document.getElementById("addBtn");
    addBtn.textContent = "Adding...";
    addBtn.disabled = true;

    let newMovie = { "title": title, "rating": selectedRating, "lat": null, "lng": null };

    getMovieLocation(
        function(pos) {
            movies.push({
                "title": title,
                "rating": selectedRating,
                "lat": pos.coords.latitude,
                "lng": pos.coords.longitude
            });
            saveMovies();
            displayMovies();
            addBtn.textContent = "Add Movie";
            addBtn.disabled = false;
        },
        function(err) {
            console.warn("Location failed:", err.message);
            movies.push(newMovie);
            saveMovies();
            displayMovies();
            addBtn.textContent = "Add Movie";
            addBtn.disabled = false;
        }
    );
}

function displayMovies(){
    let list = document.getElementById("movieList");
    list.innerHTML = "";
    for(let i = 0; i < movies.length; i++){
        let posterUrl = `https://picsum.photos/seed/${encodeURIComponent(movies[i].title)}/400/600`;
        list.innerHTML += `
            <div class="col">
                <div class="movie-card">
                    <img class="movie-poster" src="${posterUrl}" alt="${movies[i].title} poster">
                    <div class="movie-meta d-flex justify-content-between align-items-center gap-2">
                        <div class="flex-grow-1">
                            <div class="movie-name">${movies[i].title}</div>
                            <div class="movie-stars">${"★".repeat(movies[i].rating || 0)}</div>
                        </div>
                        <button type="button" class="delete-btn" onclick="deleteMovie(${i}, event)">Delete</button>
                    </div>
                </div>
            </div>
        `;
    }
}

function deleteMovie(index, event){
    event.stopPropagation();
    movies.splice(index, 1);
    saveMovies();
    displayMovies();
}

/* ---------- Drag & Drop API ---------- */
let dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("drag-active");
});

dropZone.addEventListener("dragleave", function(e){
    dropZone.classList.remove("drag-active");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("drag-active");

    let file = e.dataTransfer.files[0];
    if(!file || !file.name.toLowerCase().endsWith(".json")){
        alert("Please drop a .json file.");
        return;
    }

    let reader = new FileReader();
    reader.onload = function(event){
        let imported;
        try {
            imported = JSON.parse(event.target.result);
        } catch(err){
            alert("That file isn't valid JSON.");
            return;
        }
        if(!Array.isArray(imported)){
            alert('Expected a JSON array, e.g. [{"title":"...","rating":5}]');
            return;
        }
        
        imported.forEach(function(m){
            if(m && m.title){
                movies.push({
                    "title": m.title, 
                    "rating": Number(m.rating) || 0,
                    "lat": m.lat || null,
                    "lng": m.lng || null
                });
            }
        });
        saveMovies();
        displayMovies();
    };
    reader.readAsText(file);
});

</script>

</body>
</html>
