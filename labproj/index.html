<!DOCTYPE html>
<html>
<head>
    <title>Movie Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <style>
        :root{
            --gold: #b8860b;
            --gold-light: #d4a537;
            --paper: #faf7f2;
            --ink: #2b2620;
            --ink-soft: #6b6459;
            --hairline: #e6ddcf;
            --bs-primary: var(--gold);
            --bs-primary-rgb: 184, 134, 11;
            --bs-body-font-family: 'Jost', sans-serif;
            --bs-border-radius: 2px;
        }
        body{
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: var(--paper);
            color: var(--ink);
            letter-spacing: 0.02em;
        }
        h2{
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            letter-spacing: 0.04em;
            color: var(--ink);
            margin-bottom: 4px;
        }
        h2::after{
            content: "";
            display:block;
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 18px auto 0;
        }
        hr{ border-top: 1px solid var(--hairline); opacity: 1; }
        .btn-primary, .btn-outline-secondary{
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
            font-weight: 400;
        }
        .btn-primary{ background-color: var(--gold); border-color: var(--gold); }
        .btn-primary:hover, .btn-primary:focus{
            background-color: var(--gold-light); border-color: var(--gold-light);
        }
        .form-control:focus{
            border-color: var(--gold);
            box-shadow: 0 0 0 0.2rem rgba(184, 134, 11, 0.15);
        }
        .dropdown-item.active, .dropdown-item:active{ background-color: var(--gold); }
        .poster-card{
            aspect-ratio: 2 / 3;
            border: 2px solid var(--gold);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(43,38,32,0.08);
            cursor: pointer;
        }
        .poster-card .card-img{ width: 100%; height: 100%; object-fit: cover; }
        .poster-overlay{
            background: linear-gradient(to top, rgba(20,17,12,0.92) 0%, rgba(20,17,12,0.55) 45%, rgba(20,17,12,0) 75%);
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 16px;
            pointer-events: none;
        }
        .poster-card:hover .poster-overlay,
        .poster-card.active .poster-overlay{ opacity: 1; }
        .movie-title{
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: #fff;
            line-height: 1.15;
        }
        .stars{ color: var(--gold-light); letter-spacing: 0.1em; font-size: 0.85rem; }
        .delete-btn{
            background: rgba(20,17,12,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 0.62rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
        }
        .delete-btn:hover{ border-color: var(--gold-light); color: var(--gold-light); }

        /* Drop zone for the Drag and Drop API */
        #dropZone{
            border: 2px dashed var(--hairline);
            border-radius: 4px;
            color: var(--ink-soft);
            transition: all 0.2s ease;
            cursor: default;
        }
        #dropZone.drag-active{
            border-color: var(--gold);
            background: rgba(184, 134, 11, 0.06);
            color: var(--gold);
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 900px;">

    <h2 class="text-center mb-3">Movie Logger</h2>

    <p class="text-center mb-4">
        <a href="geolocation.html" class="link-secondary text-decoration-none small">View my movies &amp; location →</a>
    </p>

    <form class="row row-cols-auto justify-content-center g-2 align-items-center mb-3" onsubmit="return false;">
        <div class="col">
            <input type="text" id="title" class="form-control" placeholder="Movie Name">
        </div>
        <div class="col">
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="ratingDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="ratingLabel">★★★★★</span>
                </button>
                <ul class="dropdown-menu" aria-labelledby="ratingDropdown">
                    <li><a class="dropdown-item" href="#" onclick="setRating(5, this)">★★★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(4, this)">★★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(3, this)">★★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(2, this)">★★</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setRating(1, this)">★</a></li>
                </ul>
            </div>
        </div>
        <div class="col">
            <button class="btn btn-primary" onclick="addMovie()" id="addBtn">Add Movie</button>
        </div>
    </form>

    <!-- Drag & Drop target -->
    <div id="dropZone" class="text-center small py-3 mb-4">
        Drag &amp; drop a <code>.json</code> file here to import movies
    </div>

    <hr>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3" id="movieList"></div>

</div>

<script>

/* ---------- Local Storage ---------- */
let STORAGE_KEY = "movies";

let defaultMovies = [
    {"title":"One Battle After Another","rating":5, "lat":null, "lng":null},
    {"title":"Italian Spiderman","rating":5, "lat":null, "lng":null},
    {"title":"richa","rating":4, "lat":null, "lng":null},
    {"title":"The Godfather","rating":5, "lat":null, "lng":null}
];

let stored = localStorage.getItem(STORAGE_KEY);
let movies;
try {
    movies = stored ? JSON.parse(stored) : defaultMovies.slice();
} catch(e){
    movies = defaultMovies.slice();
}

let selectedRating = 5;

displayMovies();

function saveMovies(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
}

function setRating(value, el){
    selectedRating = value;
    document.getElementById("ratingLabel").textContent = "★".repeat(value);
}

function addMovie(){
    let title = document.getElementById("title").value;
    if(title == "") return;

    document.getElementById("title").value = "";
    let addBtn = document.getElementById("addBtn");
    addBtn.textContent = "Adding...";
    addBtn.disabled = true;

    // Fetch location when adding the movie to tag "where you watched it"
    if ("geolocation" in navigator && window.isSecureContext) {
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                movies.push({
                    "title": title,
                    "rating": selectedRating,
                    "lat": pos.coords.latitude,
                    "lng": pos.coords.longitude
                });
                saveMovies();
                displayMovies();
                addBtn.textContent = "Add Movie";
                addBtn.disabled = false;
            },
            function(err) {
                alert("Could not get location: " + err.message + "\nAdding movie without coordinates.");
                movies.push({"title": title, "rating": selectedRating, "lat": null, "lng": null});
                saveMovies();
                displayMovies();
                addBtn.textContent = "Add Movie";
                addBtn.disabled = false;
            },
            { timeout: 10000 }
        );
    } else {
        // Fallback if geolocation is blocked or unsupported
        movies.push({"title": title, "rating": selectedRating, "lat": null, "lng": null});
        saveMovies();
        displayMovies();
        addBtn.textContent = "Add Movie";
        addBtn.disabled = false;
    }
}

function displayMovies(){
    let list = document.getElementById("movieList");
    list.innerHTML = "";
    for(let i = 0; i < movies.length; i++){
        let posterUrl = `https://picsum.photos/seed/${encodeURIComponent(movies[i].title)}/400/600`;
        list.innerHTML +=
        `<div class="col">
            <div class="card poster-card h-100" onclick="toggleActive(this, event)">
                <img class="card-img poster" src="${posterUrl}" alt="${movies[i].title} poster">
                <button type="button" class="btn btn-sm delete-btn position-absolute top-0 end-0 m-2" onclick="deleteMovie(${i}, event)">Delete</button>
                <div class="card-img-overlay poster-overlay d-flex flex-column justify-content-end">
                    <div class="movie-title">${movies[i].title}</div>
                    <span class="stars">${"★".repeat(movies[i].rating || 0)}</span>
                </div>
            </div>
        </div>`;
    }
}

function toggleActive(card, event){
    let allCards = document.querySelectorAll("#movieList .poster-card");
    for(let i = 0; i < allCards.length; i++){
        if(allCards[i] !== card) allCards[i].classList.remove("active");
    }
    card.classList.toggle("active");
}

function deleteMovie(index, event){
    event.stopPropagation();
    movies.splice(index, 1);
    saveMovies();
    displayMovies();
}

/* ---------- Drag & Drop API ---------- */
let dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("drag-active");
});

dropZone.addEventListener("dragleave", function(e){
    dropZone.classList.remove("drag-active");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("drag-active");

    let file = e.dataTransfer.files[0];
    if(!file || !file.name.toLowerCase().endsWith(".json")){
        alert("Please drop a .json file.");
        return;
    }

    let reader = new FileReader();
    reader.onload = function(event){
        let imported;
        try {
            imported = JSON.parse(event.target.result);
        } catch(err){
            alert("That file isn't valid JSON.");
            return;
        }
        if(!Array.isArray(imported)){
            alert('Expected a JSON array, e.g. [{"title":"...","rating":5}]');
            return;
        }
        
        imported.forEach(function(m){
            if(m && m.title){
                movies.push({
                    "title": m.title, 
                    "rating": Number(m.rating) || 0,
                    "lat": m.lat || null,
                    "lng": m.lng || null
                });
            }
        });
        saveMovies();
        displayMovies();
    };
    reader.readAsText(file);
});

</script>

</body>
</html>
