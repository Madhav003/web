<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
</head>
<body>
    <div class="bg-gray-100 p-4">
        <h1 class="text-2xl font-bold text-center text-blue-600">Hello, Tailwind CSS!</h1>
        <p class="text-gray-700 mt-2 text-center">This is a simple example of using Tailwind CSS in your project.</p>
        <div class="bg-white p-4 rounded shadow hover:bg-blue-100 transition duration-300">
            <p class="text-gray-800">Hover over this box to see the background color change.</p>
        <p>now to make a form using tailwind, where you input author, name, title, year, isbn no</p>
        <form class="mt-4 space-y-4">
                <div>
                    <label for="author" class="block text-gray-700">Author:</label>
                    <input type="text" id="author" name="author" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="name" class="block text-gray-700">Name:</label>
                    <input type="text" id="name" name="name" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="title" class="block text-gray-700">Title:</label>
                    <input type="text" id="title" name="title" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="year" class="block text-gray-700">Year:</label>
                    <input type="number" id="year" name="year" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="isbn" class="block text-gray-700">ISBN No:</label>
                    <input type="text" id="isbn" name="isbn" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition duration-300">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
